<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple CMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
    <div class="max-w-3xl mx-auto p-6">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-blue-600">Simple CMS</h1>
            <p class="text-sm text-gray-500">Baca artikel terbaru dari mana saja</p>
            <a href="/admin" class="inline-block mt-3 text-sm font-medium text-blue-600 hover:text-blue-800 hover:underline">
                Masuk Area Admin &rarr;
            </a>
        </header>

        <!-- Daftar Artikel (publik, baca-saja) -->
        <section>
            <h2 class="text-xl font-semibold mb-4">Artikel Terbaru</h2>
            <div id="postsList" class="space-y-4">
                <!-- Data akan dimuat melalui JavaScript -->
                <p class="text-gray-500 text-center">Memuat artikel...</p>
            </div>
        </section>
    </div>

    <script>
        async function fetchPosts() {
            try {
                const res = await fetch('/api/posts');
                const posts = await res.json();
                const container = document.getElementById('postsList');

                if (!Array.isArray(posts) || posts.length === 0) {
                    container.innerHTML = '<p class="text-gray-500 text-center">Belum ada artikel.</p>';
                    return;
                }

                container.innerHTML = posts.map(post => `
                    <article class="bg-white p-5 rounded-lg shadow-sm border">
                        <h3 class="text-lg font-bold text-gray-800">${escapeHtml(post.title)}</h3>
                        <p class="text-xs text-gray-400 mb-2">${new Date(post.date).toLocaleString('id-ID')}</p>
                        <p class="text-gray-600 whitespace-pre-line">${escapeHtml(post.content)}</p>
                    </article>
                `).join('');
            } catch (err) {
                console.error('Gagal memuat postingan:', err);
            }
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return String(text).replace(/[&<>"']/g, m => map[m]);
        }

        fetchPosts();
    </script>
</body>
</html>
